name: PT v2.2 reference and Bristol-Coventry fixture checks (NOT integration acceptance)
on:
  pull_request:
    paths:
      - 'tests/pt_v2/**'
      - 'docs/public-transport-v2/**'
      - '.github/workflows/pt-v2-contract-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-checks:
    name: Synthetic contract and bounded GTFS fixture checks only
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove design reference behaviours (never contact providers or deployment)
        run: python -m unittest discover -s tests/pt_v2 -p 'test_*.py' -v
      - name: State scope and production gate clearly
        run: |
          echo 'Reference-model plus synthetic GTFS fixture tests only. No Android, PHP, BODS, downloaded official GTFS or real travel acceptance has been exercised.'
          echo 'Production acceptance remains 0/105 pending real GTFS import, transport engine, provider and mobile integration.'
