name: PT v2 real Coventry 11 timing relationship inspection
on:
  push:
    branches: [design/public-transport-v2-2-contract]
    paths: ['.github/workflows/pt-v2-coventry-11-rules.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded journey pattern and stop timing relationships off-host
        run: python3 tests/pt_v2/inspect_coventry_txc_rules.py
