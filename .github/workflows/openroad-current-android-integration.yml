name: OpenRoad completion — compile current 0.6.32 with v2 Java
on:
  push:
    branches: [release/openroad-completion]
    paths:
      - 'integration/ptv2/android_java_patch.py'
      - 'integration/ptv2/stage_current_android.py'
      - '.github/workflows/openroad-current-android-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Stage exact released 0.6.32 source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 integration/ptv2/stage_current_android.py --output "$RUNNER_TEMP/android.zip"
          unzip -q "$RUNNER_TEMP/android.zip" -d "$RUNNER_TEMP/android"
          project="$(find "$RUNNER_TEMP/android" -mindepth 1 -maxdepth 1 -type d | head -1)"
          bash "$project/validate.sh"
          node --check "$project/app/src/main/assets/app.js"
          test "$(grep -c ptV2Research "$project/app/src/main/assets/app.js" || true)" -eq 0
          echo "PROJECT=$project" >> "$GITHUB_ENV"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses > /dev/null || true
          "$manager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android
        run: cd "$PROJECT" && gradle --no-daemon :app:assembleDebug
      - name: Preserve research-only source, not release APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenRoad-0632-v2-Java-RESEARCH
          path: ${{ runner.temp }}/android.zip
          retention-days: 7
