name: OpenRoad mixed bus and train production acceptance (one bounded query)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/multimodal-production-smoke.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: openroad-production
    steps:
      - name: Run one read-only Bristol to Coventry mixed-route probe
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
          PRIVATE_DIR: ${{ vars.CPANEL_OPENROAD_PRIVATE_DIR }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SSH_HOST" && test -n "$SSH_USER"
          [[ "$PRIVATE_DIR" == /* ]]
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_multimodal"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          timeout 20 ssh -i "$HOME/.ssh/id_multimodal" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" bash -s -- "$PRIVATE_DIR" <<'REMOTE'
          set -euo pipefail
          priv="$1"
          test -f "$priv/lib/router.php"
          test -f "$priv/lib/multimodal_planner.php"
          timeout 11 php -d memory_limit=96M -r '
            date_default_timezone_set("Europe/London");
            require $argv[1];require $argv[2];
            $db=openroad_db();
            try{$db->exec("SET SESSION max_statement_time=0.7");}catch(Throwable $e){}
            $begin=microtime(true);
            $plan=or_mm_plan($db,51.435,-2.61,52.405,-1.514);
            $ms=(int)round((microtime(true)-$begin)*1000);
            $routes=$plan["routes"]??[];
            $modes=[];
            foreach($routes as $r){$modes[]=implode("+",array_unique(array_column($r["transitLegs"]??[],"mode"))); }
            echo "REAL_MULTIMODAL_RESULT count=".count($routes)." ms=".$ms." modes=".implode(",",$modes)."\n";
            $q=$db->query("SELECT region_key,dataset_id FROM or_regions ORDER BY region_key LIMIT 32");
            foreach($q as $region){
              if(in_array($region["region_key"],["south_west","west_midlands"],true))
                echo "REGION_READY_".strtoupper($region["region_key"])."=".((int)$region["dataset_id"]>0?"YES":"NO")."\n";
            }
            echo "WEST_MIDLANDS_REGION_CONFIGURED=".(openroad_region_config("west_midlands")?"YES":"NO")."\n";
            $bath=or_mm_plan($db,51.435,-2.61,51.378,-2.327);
            $n=0;$bestBusCount=0;
            foreach($bath["routes"]??[] as $r){
              $buses=count(array_filter($r["transitLegs"]??[],static fn($leg)=>($leg["mode"]??"")==="bus"));
              $bestBusCount=max($bestBusCount,$buses);$n++;
            }
            echo "REAL_BUS_TRAIN_BUS_BATH routes=$n max_bus_legs=$bestBusCount\n";
            // Check the actual failure case: from south of Bristol to Coventry
            // without requiring local bus data in two separate regions.
            $railRoot=dirname(dirname($argv[1]))."/cache/rail-routing/current";
            echo "RAIL_LINK_PRESENT=".(is_link($railRoot)?"YES":"NO").
                 " RAIL_INDEX_MANIFEST=".(is_file($railRoot."/manifest.json")?"YES":"NO").
                 " RAIL_INDEX_STATIONS=".(is_file($railRoot."/stations.json")?"YES":"NO").
                 " RAIL_REALPATH_OK=".(realpath($railRoot)!==false?"YES":"NO")."\n";

            $timeNow=time();
            foreach([0,3600,7200,86400] as $delta){
              $t=$timeNow+$delta;
              $departures=or_rail_departures($railRoot,"BRI",$t,$t+6*3600);
              echo "RAIL_DEPARTURES_OFFSET_$delta=".count($departures)." day=".
                   (new DateTimeImmutable("@".$t))->setTimezone(new DateTimeZone("Europe/London"))->format("D H:i")."\n";
            }
            $testTime=(new DateTimeImmutable("tomorrow 08:00",new DateTimeZone("Europe/London")))->getTimestamp();
            $tomorrow=or_rail_plan(51.449,-2.58,52.4,-1.514,$railRoot,$testTime);
            echo "RAIL_CONTROL_TOMORROW_ROUTES=".count($tomorrow["routes"]??[])."\n";
            foreach([[51.435,-2.61,52.405,-1.514],[51.415,-2.61,52.406,-1.514],
                     [51.425,-2.625,52.409,-1.515]] as $k=>$pts){
              try{
                $t=microtime(true);
                $r=or_rail_plan($pts[0],$pts[1],$pts[2],$pts[3],$railRoot);
                echo "RAIL_REGION_CASE_$k routes=".count($r["routes"]??[])." ms=".
                     (int)round((microtime(true)-$t)*1000).
                     " origin_near=".count(or_rail_near(or_rail_index($railRoot)[1],$pts[0],$pts[1],5)).
                     " dest_near=".count(or_rail_near(or_rail_index($railRoot)[1],$pts[2],$pts[3],5))."\n";
              }catch(Throwable $e){echo "RAIL_REGION_CASE_$k error=".get_class($e)." diagnostic=".preg_replace("/[^a-zA-Z0-9 ,.:_-]/","",(string)$e->getMessage())."\n";}
            }

            if($ms>10000)exit(4);
          ' "$priv/lib/router.php" "$priv/lib/multimodal_planner.php"
          REMOTE
