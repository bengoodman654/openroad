name: OpenRoad cached GTFS calendar — live read-only dry run
on:
  push:
    branches: [maintenance/pt-calendar-pedestrian-gates-20261028]
    paths: ['.github/workflows/pt-calendar-live-dryrun.yml']
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: openroad-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded calendar library PHP syntax
        run: php -l maintenance/pt-calendar/calendar_extension.php
      - name: Set up pinned SSH host identity
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_calendar"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Inspect current GTFS cached calendar only, without writes
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
          PRIVATE_DIR: ${{ vars.CPANEL_OPENROAD_PRIVATE_DIR }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$PRIVATE_DIR"
          [[ "$PRIVATE_DIR" == /* ]] || exit 1
          name="pt-calendar-dry-$GITHUB_RUN_ID.php"
          scp -i "$HOME/.ssh/id_calendar" -P "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            maintenance/pt-calendar/calendar_extension.php "$SSH_USER@$SSH_HOST:$name"
          ssh -i "$HOME/.ssh/id_calendar" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" bash -s -- "$PRIVATE_DIR" "$name" <<'REMOTE'
          set -euo pipefail
          priv="$1";name="$2"
          [[ "$priv" == /* && "$name" == pt-calendar-dry-*.php ]] || exit 1
          trap 'rm -f "$HOME/$name"' EXIT
          php -d memory_limit=128M -r '
            require $argv[1]."/lib/bootstrap.php";
            require $argv[2];
            $db=openroad_db();
            $db->exec("SET SESSION max_statement_time=3");
            $plan=or_calendar_plan($db,"south_west",
                $argv[1]."/cache/south_west_gtfs.zip",
                new DateTimeImmutable("today"),45);
            echo "CALENDAR_DRYRUN outcome=".$plan["outcome"].
                 " dataset=".$plan["dataset"].
                 " proposed_rows=".count($plan["rows"]).
                 " old_last=".($plan["oldLast"]??$plan["last"]).
                 " new_last=".($plan["newLast"]??$plan["last"])."\n";
          ' "$priv" "$HOME/$name"
          REMOTE
