name: OpenRoad PT v2 staged server source (NO DEPLOY)
on:
  push:
    branches: [pt-v2-planner-hardening]
    paths:
      - '.github/workflows/pt-v2-staged-server.yml'
      - 'pilot/php_v2_route_worker.php'
      - 'pilot/php_v2_route_worker_test.php'
      - 'pilot/stage_pt_v2_server.py'
      - 'pilot/test_stage_server.py'
      - 'pilot/php_v2_protocol.php'
      - 'pilot/php_v2_protocol_test.php'
      - 'pilot/php_v2_endpoint.php'
      - 'pilot/php_v2_process_worker.php'
      - 'pilot/php_v2_process_test.php'
      - 'pilot/php_v2_cancellation.php'
      - 'pilot/php_v2_device_adapter.php'
      - 'pilot/pt_v2_android_java_patch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    if: contains(github.event.head_commit.message, '[pt-staged-server]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate device-bound cancellation semantics
        run: |
          php -l pilot/php_v2_device_adapter.php
          php -d memory_limit=64M pilot/php_v2_cancellation_test.php
          php -d memory_limit=64M pilot/php_v2_device_adapter_test.php
          php -d memory_limit=64M pilot/php_v2_route_worker_test.php
          php -d memory_limit=64M pilot/php_v2_protocol_test.php
          php -d memory_limit=64M pilot/php_v2_process_test.php
          php -l pilot/php_v2_endpoint.php
      - name: Validate staging does not modify existing server code
        run: python3 -m unittest pilot.test_stage_server -v
      - name: Produce review-only server ZIP
        run: |
          python3 -m pilot.stage_pt_v2_server --output "$RUNNER_TEMP/pt-v2-server-source.zip"
          unzip -q "$RUNNER_TEMP/pt-v2-server-source.zip" -d "$RUNNER_TEMP/staged"
          find "$RUNNER_TEMP/staged" -name '*.php' -print0 | xargs -0 -n1 php -l
          echo "Running existing v0.2.5 source regression tests under staged router"
          for test_file in "$RUNNER_TEMP"/staged/*/tests/*_test.php; do
            test -f "$test_file"
            php -d memory_limit=128M "$test_file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRoad-PT-v2-Server-RESEARCH-SOURCE
          path: ${{ runner.temp }}/pt-v2-server-source.zip
          retention-days: 14
