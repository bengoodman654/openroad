name: OpenRoad BODS v0.2.7 — public bus line matching hotfix deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-bods-v027.yml'
permissions:
  contents: read
concurrency:
  group: openroad-production-server
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    environment: openroad-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/live-buses-20261016
          path: diagnostic-baseline
      - name: Re-run offline gateway regression fixtures before deployment
        shell: bash
        run: |
          set -euo pipefail
          src="diagnostic-baseline/snapshots/server/OpenRoad-Transport-Server-v0.2.5-source"
          cp maintenance/bods-v0.2.7/bods_gateway.php "$src/private/lib/bods_gateway.php"
          cp maintenance/bods-v0.2.7/bods_gateway_test.php "$src/tests/bods_gateway_test.php"
          php -l "$src/private/lib/bods_gateway.php"
          php -l "$src/tests/bods_gateway_test.php"
          php "$src/tests/bods_gateway_test.php"
      - name: Configure pinned SSH host key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_openroad_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Back up and atomically replace only BODS gateway on JustHostMe
        shell: bash
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
          PRIVATE_DIR: ${{ vars.CPANEL_OPENROAD_PRIVATE_DIR }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?}" "${SSH_USER:?}" "${PRIVATE_DIR:?}"
          [[ "$PRIVATE_DIR" == /* ]] || { echo 'Unexpected non-absolute private directory'; exit 1; }
          source_file="maintenance/bods-v0.2.7/bods_gateway.php"
          expected="$(sha256sum "$source_file" | cut -d' ' -f1)"
          ssh_opts=(-i ~/.ssh/id_openroad_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          scp -i ~/.ssh/id_openroad_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$source_file" "$SSH_USER@$SSH_HOST:openroad-bods-v027.upload.php"
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$PRIVATE_DIR" "$expected" <<'REMOTE'
          set -Eeuo pipefail
          priv="$1"
          expected="$2"
          [[ "$priv" == /* ]] || exit 1
          target="$priv/lib/bods_gateway.php"
          incoming="$HOME/openroad-bods-v027.upload.php"
          test -f "$target" && test -f "$incoming"
          actual="$(sha256sum "$incoming" | cut -d' ' -f1)"
          [[ "$actual" == "$expected" ]] || { echo 'Uploaded file digest mismatch, aborting.' >&2; exit 1; }
          php -l "$incoming" >/dev/null
          backup="$HOME/openroad-backups/bods-v027-$(date -u +%Y%m%dT%H%M%SZ)-$$"
          mkdir -p "$backup"
          cp -p "$target" "$backup/bods_gateway.php"
          cleanup() { rm -f "$incoming" "$target.new"; }
          rollback() {
            rc="$?"
            trap - ERR
            cp -p "$backup/bods_gateway.php" "$target.rollback" &&
              mv -f "$target.rollback" "$target" || true
            echo 'BODS gateway deployment failed; original gateway restored where possible.' >&2
            exit "$rc"
          }
          trap cleanup EXIT
          trap rollback ERR
          cp "$incoming" "$target.new"
          chmod --reference="$target" "$target.new"
          mv -f "$target.new" "$target"
          php -l "$target" >/dev/null
          php -r 'require $argv[1]; if (!function_exists("openroad_bods_live") || !function_exists("openroad_bods_key")) exit(1);' "$target"
          trap - ERR
          echo "Deployed one PHP gateway file; previous version backed up in $backup"
          REMOTE
