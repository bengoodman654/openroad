name: PT v2 Coventry 11 real multi-day all-trip audit
on:
  push:
    branches: [design/public-transport-v2-2-contract]
    paths: ['.github/workflows/pt-v2-coventry-multidays.yml']
permissions:
  contents: read
jobs:
  off-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stream two official TXC revisions and evaluate all 11 trip patterns for four scoped days
        run: python3 tests/pt_v2/audit_coventry_11_multidays.py
      - name: Mark integration unverified
        run: echo 'No production acceptance; 0/105. Only off-host dated candidate coverage.'
