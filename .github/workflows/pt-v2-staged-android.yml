name: OpenRoad PT v2 staged Android debug build (NO DEPLOY)
on:
  push:
    branches: [pt-v2-planner-hardening]
    paths:
      - '.github/workflows/pt-v2-staged-android.yml'
      - 'pilot/pt_v2_android_java_patch.py'
      - 'pilot/stage_pt_v2_android.py'
      - 'pilot/test_staged_android.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    if: contains(github.event.head_commit.message, '[pt-staged-android]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest pilot.test_staged_android -v
      - run: python3 -m pilot.stage_pt_v2_android --output "$RUNNER_TEMP/pt-v2-android-source.zip"
      - name: Check original app validation and JavaScript syntax
        shell: bash
        run: |
          unzip -q "$RUNNER_TEMP/pt-v2-android-source.zip" -d "$RUNNER_TEMP/staged"
          project="$(find "$RUNNER_TEMP/staged" -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          node --check "$project/app/src/main/assets/app.js"
          bash "$project/validate.sh"
          node pilot/test_staged_android_ui.cjs "$project/app/src/main/assets/app.js"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install isolated Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile staging debug APK only (never release or deploy)
        run: cd "$PROJECT" && gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRoad-PT-v2-Android-RESEARCH-SOURCE
          path: ${{ runner.temp }}/pt-v2-android-source.zip
          retention-days: 14
