name: OpenRoad read-only Python runtime and process capability audit
on:
  push:
    branches: [release/openroad-completion]
    paths: ['.github/workflows/openroad-python-runtime-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: openroad-production
    timeout-minutes: 5
    steps:
      - name: Read runtime capabilities only (no uploads or process work)
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SSH_HOST" && test -n "$SSH_USER"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_runtime
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_runtime -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
              -o BatchMode=yes "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          php -r '
            foreach(["proc_open","exec","shell_exec","pcntl_fork"] as $f){
              echo "PROCESS_CAPABILITY function=".$f." allowed=".
                   (function_exists($f)?"yes":"no")."\n";
            }
          '
          for tag in system39 system310 system311 alt39 alt310 alt311; do
            case "$tag" in
              system39) exe="$(command -v python3.9 || true)" ;;
              system310) exe="$(command -v python3.10 || true)" ;;
              system311) exe="$(command -v python3.11 || true)" ;;
              alt39) exe="/opt/alt/python39/bin/python3.9" ;;
              alt310) exe="/opt/alt/python310/bin/python3.10" ;;
              alt311) exe="/opt/alt/python311/bin/python3.11" ;;
            esac
            if test -n "$exe" && test -x "$exe"; then
              "$exe" -c 'import sys,sqlite3,json;from importlib.util import find_spec;print("PYTHON_RUNTIME tag="+sys.argv[1]+" version=%d.%d sqlite=yes zoneinfo=%s"%(sys.version_info.major,sys.version_info.minor,"yes" if find_spec("zoneinfo") else "no"))' "$tag"
            else
              echo "PYTHON_RUNTIME tag=$tag available=no"
            fi
          done
          if command -v python3 >/dev/null 2>&1; then
            python3 -c 'import sys;print("PYTHON_RUNTIME tag=default version=%d.%d"%(sys.version_info.major,sys.version_info.minor))'
          fi
          if command -v timeout >/dev/null 2>&1; then
            echo "CLI_TIMEOUT_TOOL available=yes"
          else
            echo "CLI_TIMEOUT_TOOL available=no"
          fi
          REMOTE
