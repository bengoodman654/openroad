name: OpenRoad exact Android/PHP integration hooks
on:
  push:
    branches: [pt-v2-planner-hardening]
    paths: ['.github/workflows/pt-v2-exact-hooks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[pt-exact-hooks]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 pilot/pt_v2_exact_hooks.py
