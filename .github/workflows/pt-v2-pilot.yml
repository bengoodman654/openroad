name: OpenRoad PT v2 pilot fixture tests
on:
  push:
    branches: [pt-v2-coverage-gates, pt-v2-planner-hardening]
    paths: ['pilot/**', '.github/workflows/pt-v2-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest pilot.test_gtfs_engine -v
  journey:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [test_direct_bus, test_transfer_without_footpaths, test_explicit_footpath_transfer, test_footpath_outcome_only, test_footpath_arrival_only, test_footpath_warning_only, test_footpath_metres_only, test_hard_walk_limit, test_invalid_footpath_rejected, test_unknown_stop, test_zero_transfers_means_one_bus, test_a_budget_failure_is_not_no_service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest pilot.test_journey_options.OptionsTests.${{ matrix.case }} -v

  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all isolated PT regression cases
        run: python3 -m unittest discover -s pilot -p 'test_*.py' -v

  osm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install off-host OSM parser on isolated runner
        run: python3 -m pip install 'osmium==4.3.2'
      - name: Parse tiny reference-complete OSM fixture
        run: python3 -m unittest pilot.test_osm_adapter -v

  php-cancellation-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone PHP server cancellation prototype
        run: php -d memory_limit=64M pilot/php_v2_cancellation_test.php

  js-screen-state-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android UI state invariants in isolated JavaScript
        run: node pilot/pt_v2_screen_state.test.js
