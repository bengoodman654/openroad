name: OpenRoad PT v2 pilot fixture tests
on:
  push:
    branches:
      - pt-v2-coverage-gates
    paths:
      - 'pilot/**'
      - '.github/workflows/pt-v2-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check 23 synthetic PT scenarios
        run: python3 -m unittest discover -s pilot -p 'test_*.py' -v
