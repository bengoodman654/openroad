name: OpenRoad journey SQL diagnosis (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-journey-sql-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: openroad-production
    timeout-minutes: 5
    steps:
      - name: Read-only timetable and index metadata (no journey searches)
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
          PRIVATE_DIR: ${{ vars.CPANEL_OPENROAD_PRIVATE_DIR }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$PRIVATE_DIR"
          [[ "$PRIVATE_DIR" == /* ]] || exit 1
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_openroad_diagnostic"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_openroad_diagnostic" -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              bash -s -- "$PRIVATE_DIR" <<'REMOTE'
          set -euo pipefail
          private_dir="$1"
          test -f "$private_dir/lib/bootstrap.php"

          # Output aggregate performance classes only, never raw location/log lines.
          if test -f "$private_dir/logs/journey-timings.jsonl"; then
            tail -n 120 "$private_dir/logs/journey-timings.jsonl" | php -r '
              $counts=[];$durations=[];
              while(($line=fgets(STDIN))!==false){
                $r=json_decode($line,true);
                if(!is_array($r)||($r["event"]??"")!=="journey")continue;
                $key=($r["phase"]??"unknown").":".($r["outcome"]??"unknown");
                $counts[$key]=($counts[$key]??0)+1;
                $durations[$key][]=max(0,(int)($r["ms"]??0));
              }
              echo "AGGREGATE_JOURNEY_TIMINGS_BEGIN\n";
              foreach($counts as $key=>$n){
                sort($durations[$key]);$v=$durations[$key];
                $p95=$v[(int)floor((count($v)-1)*0.95)]??0;
                echo preg_replace("/[^a-zA-Z0-9_:.-]/","",$key)." count=".$n." p95ms=".$p95."\n";
              }
              echo "AGGREGATE_JOURNEY_TIMINGS_END\n";
            '
          fi

          printf 'LIVE_SOURCE_HASHES_BEGIN\n'
          sha256sum "$private_dir/lib/router.php"
          printf 'LIVE_SOURCE_HASHES_END\n'

          php -d display_errors=stderr -r '
            require $argv[1];
            $db=openroad_db();
            try{$db->exec("SET SESSION max_statement_time=0.5");}catch(Throwable $ignored){}
            echo "REGIONS_BEGIN\n";
            foreach($db->query("SELECT region_key,dataset_id,DATE(updated_at) updated_day FROM or_regions ORDER BY region_key LIMIT 32") as $r) {
              echo preg_replace("/[^a-zA-Z0-9_-]/","",(string)$r["region_key"])." ds=".(int)$r["dataset_id"]." day=".(string)$r["updated_day"]."\n";
            }
            echo "REGIONS_END\n";
            echo "PREPARE_QUEUE_BEGIN\n";
            foreach($db->query("SELECT region_key,attempts FROM or_prepare_queue ORDER BY region_key LIMIT 32") as $r) {
              echo preg_replace("/[^a-zA-Z0-9_-]/","",(string)$r["region_key"])." attempts=".(int)$r["attempts"]."\n";
            }
            echo "PREPARE_QUEUE_END\n";
            foreach(["or_stop_times","or_trips","or_service_dates","or_stops"] as $table){
              $stmt=$db->prepare("SELECT TABLE_ROWS,DATA_LENGTH,INDEX_LENGTH FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=?");
              $stmt->execute([$table]);$row=$stmt->fetch();
              echo "TABLE ".$table." approx_rows=".(int)($row["TABLE_ROWS"]??0)." estimated_data_bytes=".(int)($row["DATA_LENGTH"]??0)." estimated_index_bytes=".(int)($row["INDEX_LENGTH"]??0)."\n";
              $q=$db->query("SHOW INDEX FROM ".$table);
              $indices=[];
              foreach($q as $ix){
                $k=(string)$ix["Key_name"];$seq=(int)$ix["Seq_in_index"];
                $indices[$k][$seq]=(string)$ix["Column_name"];
              }
              foreach($indices as $k=>$columns){ksort($columns);echo "INDEX ".$table.".".$k."(".implode(",",$columns).")\n";}
            }
            // Only indexed calendar lookups, no stop-time scans.
            $q=$db->prepare("SELECT dataset_id FROM or_regions WHERE region_key=? LIMIT 1");
            $q->execute(["south_west"]);
            $ds=(int)($q->fetchColumn()?:0);
            echo "SOUTH_WEST_CALENDAR_BEGIN\n";
            if($ds>0){
              $q=$db->prepare("SELECT MIN(service_date) earliest,MAX(service_date) latest FROM or_service_dates WHERE dataset_id=?");
              $q->execute([$ds]);$r=$q->fetch();
              echo "SERVICE_WINDOW earliest=".($r["earliest"]??"none")." latest=".($r["latest"]??"none")."\n";
              $q=$db->prepare("SELECT COUNT(*) total FROM or_service_dates WHERE dataset_id=? AND service_date=CURDATE()");
              $q->execute([$ds]);echo "ACTIVE_SERVICE_IDS_TODAY ".(int)$q->fetchColumn()."\n";
              $q=$db->prepare("SELECT COUNT(*) total FROM or_service_dates WHERE dataset_id=? AND service_date=DATE_ADD(CURDATE(),INTERVAL 1 DAY)");
              $q->execute([$ds]);echo "ACTIVE_SERVICE_IDS_TOMORROW ".(int)$q->fetchColumn()."\n";
            }
            echo "SOUTH_WEST_CALENDAR_END\n";
            // Read-only EXPLAIN: do not execute an expensive route query.
            $find=$db->prepare("SELECT stop_id FROM or_stops WHERE dataset_id=? AND stop_lat BETWEEN ? AND ? AND stop_lon BETWEEN ? AND ? LIMIT 4");
            $find->execute([$ds,51.430,51.448,-2.63,-2.58]);
            $from=$find->fetchAll(PDO::FETCH_COLUMN);
            $find->execute([$ds,51.45,51.49,-2.65,-2.60]);
            $to=$find->fetchAll(PDO::FETCH_COLUMN);
            if(count($from)>0 && count($to)>0){
              $phFrom=implode(",",array_fill(0,count($from),"?"));
              $phTo=implode(",",array_fill(0,count($to),"?"));
              $sql="EXPLAIN SELECT b.trip_id,b.stop_id,a.stop_id FROM or_stop_times b JOIN or_trips t ON t.dataset_id=b.dataset_id AND t.trip_id=b.trip_id JOIN or_service_dates sd ON sd.dataset_id=t.dataset_id AND sd.service_id=t.service_id AND sd.service_date=CURDATE() JOIN or_stop_times a ON a.dataset_id=b.dataset_id AND a.trip_id=b.trip_id AND a.stop_sequence>b.stop_sequence JOIN or_routes r ON r.dataset_id=t.dataset_id AND r.route_id=t.route_id WHERE b.dataset_id=? AND b.stop_id IN ($phFrom) AND a.stop_id IN ($phTo) AND b.departure_sec BETWEEN ? AND ? ORDER BY b.departure_sec LIMIT 2600";
              $q=$db->prepare($sql);
              $now=((int)date("H"))*3600+((int)date("i"))*60;
              $q->execute([$ds,...$from,...$to,$now,$now+7200]);
              echo "ORIGINAL_QUERY_EXPLAIN_BEGIN\n";
              foreach($q as $r){
                echo "table=".$r["table"]." type=".$r["type"]." key=".($r["key"]??"none")." estimated_rows=".(int)$r["rows"]." extra=".substr((string)($r["Extra"]??""),0,110)."\n";
              }
              echo "ORIGINAL_QUERY_EXPLAIN_END\n";
            }
            echo "READ_ONLY_DIAG_COMPLETE\n";
          ' "$private_dir/lib/bootstrap.php"
          # One bounded, non-mutating candidate query. No route-cache writes.
          php -d display_errors=stderr -r '
            require $argv[1];
            $db=openroad_db();
            try{$db->exec("SET SESSION max_statement_time=0.9");}catch(Throwable $ignored){}
            $ds=openroad_region_dataset($db,"south_west");
            $started=microtime(true);
            or_route_deadline($started+3.5);
            $orig=or_stop_map(or_nearby_stops($db,$ds,51.438,-2.607,1200,10));
            $dest=or_stop_map(or_nearby_stops($db,$ds,51.459,-2.627,1200,10));
            try {
              $direct=or_direct_candidates($db,$ds,$orig,$dest,or_current_seconds(),7200);
              echo "READ_ONLY_DIRECT_SMOKE outcome=OK candidates=".count($direct).
                   " duration_ms=".(int)round((microtime(true)-$started)*1000)."\n";
            } catch(Throwable $e) {
              echo "READ_ONLY_DIRECT_SMOKE outcome=ERROR class=".get_class($e).
                   " code=".preg_replace("/[^a-zA-Z0-9_-]/","",(string)$e->getCode()).
                   " duration_ms=".(int)round((microtime(true)-$started)*1000)."\n";
            }
          ' "$private_dir/lib/router.php"
          REMOTE
