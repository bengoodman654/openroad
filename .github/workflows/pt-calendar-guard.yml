name: OpenRoad timetable freshness and hosting safety
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pt-calendar-guard.yml']
  schedule:
    - cron: '21 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openroad-timetable-readonly-guard
  cancel-in-progress: true
jobs:
  freshness:
    runs-on: ubuntu-24.04
    environment: openroad-production
    timeout-minutes: 5
    steps:
      - name: Guard active calendar and hosting space without changes
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
          PRIVATE_DIR: ${{ vars.CPANEL_OPENROAD_PRIVATE_DIR }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$PRIVATE_DIR"
          [[ "$PRIVATE_DIR" == /* ]] || exit 1
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_openroad_calendar"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_openroad_calendar" -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            bash -s -- "$PRIVATE_DIR" <<'REMOTE'
          set -euo pipefail
          private="$1"
          test -f "$private/lib/bootstrap.php"
          test -f "$private/bin/update_gtfs.php"
          echo "CALENDAR_GUARD date=$(date -u +%F)"
          df -Pk "$private" | tail -1 | awk '{print "HOST_DISK available_KiB="$4" used_pct="$5}'
          cache_kib="$(du -sk "$private/cache" 2>/dev/null | awk '{print $1}' || true)"
          echo "OPENROAD_CACHE size_KiB=$cache_kib"
          for name in south_west_gtfs.zip west_midlands_gtfs.zip; do
            if test -f "$private/cache/$name"; then
              stat -c "GTFS_CACHE bytes=%s changed_epoch=%Y" "$private/cache/$name"
            else
              echo "GTFS_CACHE missing"
            fi
          done
          count="$( (crontab -l 2>/dev/null || true) | grep -Eic 'openroad|update_gtfs|process_preload_queue' || true)"
          echo "OPENROAD_CRON entries=$count"
          # Print only fixed classifications, never full cron lines (may
          # contain private account paths or command-line credentials).
          (crontab -l 2>/dev/null || true) | php -r '
            $known=["update_gtfs"=>"gtfs_full_import",
              "process_preload_queue"=>"preload_queue",
              "cleanup"=>"cleanup_job",
              "refresh"=>"refresh_job"];
            $counts=[];
            while(($line=fgets(STDIN))!==false){
              $line=trim($line);if($line===""||$line[0]==="#")continue;
              foreach($known as $needle=>$role){
                if(stripos($line,$needle)!==false)
                  $counts[$role]=($counts[$role]??0)+1;
              }
            }
            foreach($known as $role)
              echo "CRON_ROLE ".$role." count=".($counts[$role]??0)."\n";
            // Output timetable refresh cadence only, not command contents.
            $raw=shell_exec("crontab -l 2>/dev/null")??"";
            foreach(preg_split("/\r?\n/",$raw) as $entry){
              if(!preg_match("/update_gtfs|process_preload_queue/i",$entry))continue;
              if(preg_match("/^\s*([0-9*\/,\-]+\s+){4}[0-9*\/,\-]+/",$entry,$m)){
                $role=stripos($entry,"update_gtfs")!==false?"full_gtfs_import":"queue";
                echo "CRON_CADENCE ".$role." schedule=".
                     preg_replace("/[^0-9*\/,\-\s]/","",$m[0])."\n";
              }else echo "CRON_CADENCE other schedule=unavailable\n";
            }
          '
          # Inspect nightly importer execution prerequisites, without
          # outputting any cron command, path or secret.
          php -r '
            $raw=shell_exec("crontab -l 2>/dev/null")??"";
            foreach(preg_split("/\r?\n/",$raw) as $line){
              if(stripos($line,"update_gtfs")===false || str_starts_with(trim($line),"#"))continue;
              $discard=str_contains($line,"/dev/null");
              $logFile=false;
              if(preg_match("/(?:^|\s)(?:[12])?>>?\s*([^\s;&|]+)/",$line,$m)){
                $target=trim($m[1],"\"\\x27");
                if(str_starts_with($target,"/") && is_file($target))$logFile=true;
              }
              echo "NIGHTLY_IMPORT_LOGGING output_discarded=".($discard?"yes":"no").
                   " existing_absolute_log_target=".($logFile?"yes":"no")."\n";
            }
            foreach(["pdo_mysql","zip","curl"] as $ext)
              echo "CLI_EXTENSION ".$ext."=". (extension_loaded($ext)?"yes":"no")."\n";
            echo "CLI_PHP_VERSION major=".PHP_MAJOR_VERSION." minor=".PHP_MINOR_VERSION."\n";
          '
          # Keep filenames and raw log content private. Report only
          # coarse recent errors and log age.
          php -r '
            $root=$argv[1];
            foreach([$root."/logs",$root."/cache",dirname($root)."/logs"] as $dir){
              if(!is_dir($dir))continue;
              foreach(scandir($dir)?:[] as $name){
                if(!preg_match("/(?:gtfs|import|update)/i",$name))continue;
                $f=$dir."/".$name;
                if(!is_file($f) || filesize($f)>100000000)continue;
                $age=(int)floor((time()-filemtime($f))/86400);
                $tail=@file_get_contents($f,false,null,max(0,filesize($f)-5000),5000);
                $kind="no_classified_failure";
                if(is_string($tail)){
                  foreach(["memory","execution time","disk full","quota","deadlock",
                           "duplicate entry","connection","download failed",
                           "zip","permission","mysql","sqlstate"] as $keyword){
                    if(stripos($tail,$keyword)!==false){$kind=str_replace(" ","_",$keyword);break;}
                  }
                }
                echo "IMPORT_FILE role=log_or_archive age_days=".$age.
                     " last_error_class=".$kind."\n";
              }
            }
          ' "$private"
          # Identify why the daily full-import cron has not activated a new
          # dataset since September. Only aggregate recognized stages/errors;
          # never print complete log lines or cron command.
          php -r '
            $entries=explode("\n",(string)shell_exec("crontab -l 2>/dev/null"));
            foreach($entries as $entry){
              if(stripos($entry,"update_gtfs")===false || str_starts_with(trim($entry),"#"))continue;
              if(!preg_match("/(?:^|\s)[12]?>{1,2}\s*(\/[^\s;&|]+)/",$entry,$m)){
                echo "IMPORT_LOG audit=no_log_path\n";continue;
              }
              $path=trim($m[1],"\"\\x27");
              if(!is_file($path)){echo "IMPORT_LOG audit=file_missing\n";continue;}
              $size=(int)filesize($path);
              $mtime=filemtime($path);
              $tail=(string)file_get_contents($path,false,null,max(0,$size-65536),65536);
              $seen=[];
              foreach([
                "Downloading official DfT"=>"started_download",
                "Download complete"=>"downloaded",
                "Importing stops"=>"import_stops",
                "Importing routes"=>"import_routes",
                "Importing trips"=>"import_trips",
                "Building active service dates"=>"import_calendar",
                "Importing stop times"=>"import_stop_times",
                "Importing full route shapes"=>"import_shapes",
                "Activated "=>"activated",
                "Update complete"=>"completed",
                "OpenRoad GTFS update failed"=>"failed",
                "Another GTFS update"=>"busy_lock",
                "SQLSTATE"=>"sql_error",
                "Fatal error"=>"php_fatal",
                "Allowed memory size"=>"memory_exhaustion",
                "execution time"=>"execution_timeout",
                "Download failed"=>"failed_download",
              ] as $needle=>$tag){
                if(stripos($tail,$needle)!==false)$seen[]=$tag;
              }
              echo "IMPORT_LOG size_bytes=".$size.
                   " age_minutes=".(int)((time()-$mtime)/60).
                   " stages=".implode(",",$seen)."\n";
              foreach(array_slice(preg_split("/\r?\n/",$tail),-40) as $line){
                if(preg_match("/\[([0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:]{8})\]/",$line,$m))
                    $lastSeen=$m[1];
              }
              if(isset($lastSeen))echo "IMPORT_LOG last_timestamp=".$lastSeen."\n";
              foreach(array_slice(preg_split("/\r?\n/",$tail),-8) as $line){
                $line=trim($line);
                if($line==="")continue;
                $line=preg_replace("/https?:\/\/[^\s]+/i","[URL]",$line);
                $line=preg_replace("~\/home\/[^\s]+~i","[PRIVATE_PATH]",$line);
                $line=preg_replace("/(?i)(password|api[_-]?key|token|secret)\s*[:=]\s*\S+/","[REDACTED]",$line);
                $line=preg_replace("/[A-Za-z0-9_\-]{45,}/","[LONG_TOKEN]",$line);
                echo "IMPORT_LOG_TAIL ".substr($line,0,180)."\n";
              }
            }
          '
          # Lightweight archive metadata, no decompression of large GTFS
          # stop_times/shapes; identify calendar horizon only.
          php -d memory_limit=48M -r '
            $path=$argv[1];if(!is_file($path)){echo "CACHE_GTFS absent\n";exit;}
            if(!class_exists("ZipArchive")){echo "CACHE_GTFS zip_extension_missing\n";exit;}
            $z=new ZipArchive();
            if($z->open($path)!==true){echo "CACHE_GTFS invalid_zip\n";exit;}
            foreach(["calendar.txt","calendar_dates.txt"] as $file){
              $stream=$z->getStream($file);
              if(!$stream){echo "CACHE_GTFS missing_".$file."\n";continue;}
              $header=fgetcsv($stream);if(!is_array($header)){fclose($stream);continue;}
              $header=array_map("trim",$header);
              $dateCol=array_search($file==="calendar.txt"?"end_date":"date",$header,true);
              $latest="";
              $rows=0;
              while(($row=fgetcsv($stream))!==false && $rows<300000){
                $rows++;
                if($dateCol!==false && isset($row[$dateCol]) &&
                   preg_match("/^[0-9]{8}$/D",$row[$dateCol]) &&
                   $row[$dateCol]>$latest)$latest=$row[$dateCol];
              }
              fclose($stream);
              echo "CACHE_GTFS file=".$file." scanned_rows=".$rows.
                   " latest_source_date=".($latest?:"unknown")."\n";
            }
            $z->close();
          ' "$private/cache/south_west_gtfs.zip"
          php -d memory_limit=64M -r '
            require $argv[1];
            $db=openroad_db();
            try{$db->exec("SET SESSION max_statement_time=0.5");}catch(Throwable $ignored){}
            $q=$db->prepare("SELECT region_key,dataset_id,DATE(updated_at) activated_date FROM or_regions WHERE region_key IN (?,?)");
            $q->execute(["south_west","west_midlands"]);
            $rows=$q->fetchAll(PDO::FETCH_ASSOC);
            foreach($rows as $r){
              $s=$db->prepare("SELECT MIN(service_date) earliest,MAX(service_date) latest FROM or_service_dates WHERE dataset_id=?");
              $s->execute([(int)$r["dataset_id"]]);$d=$s->fetch(PDO::FETCH_ASSOC);
              $latest=$d["latest"]??null;
              $days=$latest===null?-999:(int)floor((strtotime($latest." 12:00:00 UTC")-strtotime(gmdate("Y-m-d")." 12:00:00 UTC"))/86400);
              echo "REGION ".$r["region_key"]." activated=".$r["activated_date"].
                   " first=".($d["earliest"]??"none")." last=".($latest??"none").
                   " days_left=".$days."\n";
              if($r["region_key"]==="south_west" && $days<=7) {
                fwrite(STDERR,"URGENT: South West GTFS calendar expires within seven days. Run controlled refresh before expiry.\n");
                exit(8);
              }
              if($r["region_key"]==="south_west" && $days<=14) {
                echo "WARNING South West timetable needs a controlled refresh before expiry.\n";
              }
            }
            if(!array_filter($rows,static fn($r)=>$r["region_key"]==="south_west")){
              fwrite(STDERR,"ERROR: South West dataset absent\n");
              exit(9);
            }
          ' "$private/lib/bootstrap.php"
          REMOTE
