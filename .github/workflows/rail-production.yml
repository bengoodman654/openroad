name: OpenRoad national rail daily production refresh
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rail-production.yml']
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openroad-production-rail
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment: openroad-production
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP and Python source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile maintenance/rail/build_rail_index.py
          php -l maintenance/rail/rail_planner.php
          php -l maintenance/rail/rail_train_detail.php
          php -l maintenance/rail/rail_gateway.php
          php -l maintenance/rail/rail_train_live.php
          php -l maintenance/rail/train_live.php
          php -l maintenance/rail/test_train_live.php
          php -l maintenance/rail/train_detail.php
          php -l maintenance/rail/test_train_detail.php
          php -l maintenance/rail/rail_journeys.php
          php -l maintenance/rail/multimodal_planner.php
          php -l maintenance/rail/multimodal.php
          php -l maintenance/rail/test_multimodal.php
          php -l maintenance/rail/test_real_smoke.php
      - name: Identify approved current GB rail GTFS release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/planarnetwork/gb-transit/releases/latest' > /tmp/rail-release.json
          python3 - <<'PY'
          import json,datetime as dt
          d=json.load(open('/tmp/rail-release.json'))
          published=dt.datetime.fromisoformat(d['published_at'].replace('Z','+00:00'))
          if not (0 <= (dt.datetime.now(dt.timezone.utc)-published).days <= 14):
              raise SystemExit('Rail timetable feed too old; refuse refresh')
          entries=[a for a in d.get('assets',[]) if a.get('name')=='gtfs-national-rail-only.zip']
          if len(entries)!=1 or not 10000000<=entries[0]['size']<=80000000:
              raise SystemExit('Unexpected rail feed archive size')
          url=entries[0]['browser_download_url']
          if not url.startswith('https://github.com/planarnetwork/gb-transit/releases/download/'):
              raise SystemExit('Untrusted rail feed URL')
          open('/tmp/rail-feed-url','w').write(url)
          PY
      - name: Download, compile and validate scheduled services
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat /tmp/rail-feed-url)"
          curl --fail --location --silent --show-error --retry 2 --max-time 150 \
            --max-filesize 80000000 "$url" --output /tmp/rail-gtfs.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/rail-gtfs.zip') as z:
              names={n.split('/')[-1].lower() for n in z.namelist()}
              if not {'stops.txt','trips.txt','routes.txt','stop_times.txt','calendar.txt'}<=names:
                  raise SystemExit('Incomplete GTFS')
              if sum(i.file_size for i in z.infolist())>1000000000:
                  raise SystemExit('Refusing unexpectedly large uncompressed feed')
              if z.testzip() is not None: raise SystemExit('GTFS archive checksum error')
          PY
          python3 maintenance/rail/build_rail_index.py /tmp/rail-gtfs.zip /tmp/rail-index
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect('file:/tmp/rail-index/events.sqlite?mode=ro',uri=True)
          status=db.execute('PRAGMA quick_check').fetchone()[0]
          if status!='ok':raise SystemExit('Rail index SQLite integrity failed')
          n=db.execute('SELECT COUNT(*) FROM events').fetchone()[0]
          if n<30000:raise SystemExit('Insufficient scheduled rail connections')
          print('RAIL_SQLITE_VALIDATED connections='+str(n))
          db.close()
          PY
          php -d memory_limit=64M maintenance/rail/test_real_smoke.php /tmp/rail-index
          php -d memory_limit=64M maintenance/rail/test_train_detail.php /tmp/rail-index
          php -d memory_limit=64M maintenance/rail/test_train_live.php
          php -d memory_limit=64M maintenance/rail/test_multimodal.php /tmp/rail-index
          tar -czf /tmp/rail-index.tar -C /tmp rail-index
          test "$(stat -c %s /tmp/rail-index.tar)" -lt 95000000
          echo 'RAIL_BUILD_AND_BRISTOL_COVENTRY_SMOKE_PASSED'

      - name: Deploy proven source and index with pinned SSH, backup and atomic activation
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.CPANEL_SSH_HOST }}
          USERNAME: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
          PRIVATE_DIR: ${{ vars.CPANEL_OPENROAD_PRIVATE_DIR }}
          PUBLIC_DIR: ${{ vars.CPANEL_OPENROAD_PUBLIC_DIR }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST" && test -n "$USERNAME"
          [[ "$PRIVATE_DIR" == /* && "$PUBLIC_DIR" == /* && "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_rail"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf 'Host rail-production\n HostName %s\n User %s\n Port %s\n IdentityFile %s/.ssh/id_rail\n StrictHostKeyChecking yes\n BatchMode yes\n' \
            "$HOST" "$USERNAME" "$SSH_PORT" "$HOME" > "$HOME/.ssh/config"
          stage="openroad-rail-stage-$GITHUB_RUN_ID"
          set +e
          timeout 10 ssh -o ConnectTimeout=7 rail-production true 2> /tmp/openroad-ssh-diagnostic.log
          status="$?"
          set -e
          if test "$status" -ne 0; then
            if grep -qi 'Host key verification failed' /tmp/openroad-ssh-diagnostic.log; then echo 'RAIL_SSH_HOST_KEY_MISMATCH'
            elif grep -qi 'Permission denied' /tmp/openroad-ssh-diagnostic.log; then echo 'RAIL_SSH_AUTHENTICATION_FAILED'
            elif grep -qi 'Connection refused' /tmp/openroad-ssh-diagnostic.log; then echo 'RAIL_SSH_CONNECTION_REFUSED'
            elif grep -qi 'Could not resolve hostname' /tmp/openroad-ssh-diagnostic.log; then echo 'RAIL_SSH_DNS_FAILED'
            elif grep -qi 'timed out' /tmp/openroad-ssh-diagnostic.log || test "$status" -eq 124; then echo 'RAIL_SSH_TIMED_OUT'
            else echo 'RAIL_SSH_UNKNOWN_FAILURE'; fi
            exit 31
          fi
          echo 'RAIL_SSH_CONNECTED'
          ssh rail-production bash -s -- "$stage" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^openroad-rail-stage-[0-9]+$ ]]
          mkdir -p -m 0700 "$HOME/$1"
          echo RAIL_STAGE_DIRECTORY_READY
          REMOTE
          # Upload the precompressed per-station shard files individually. The
          # shared host killed tar extraction processes during earlier attempts;
          # copying 137 small files avoids all decompression CPU on cPanel.
          echo "RAIL_UPLOAD_BEGIN index_kib=$(du -sk /tmp/rail-index | cut -f1)"
          scp -O -r -o ServerAliveInterval=5 -o ServerAliveCountMax=3 /tmp/rail-index \
            maintenance/rail/rail_planner.php maintenance/rail/rail_journeys.php \
            maintenance/rail/multimodal_planner.php maintenance/rail/multimodal.php \
            maintenance/rail/rail_train_detail.php maintenance/rail/train_detail.php \
            maintenance/rail/rail_gateway.php maintenance/rail/rail_train_live.php maintenance/rail/train_live.php \
            maintenance/rail/test_train_detail.php maintenance/rail/test_train_live.php \
            maintenance/rail/test_real_smoke.php maintenance/rail/test_multimodal.php "rail-production:$stage/"
          echo RAIL_UPLOAD_COMPLETE
          indexsum="$(cd /tmp/rail-index && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          plannersum="$(sha256sum maintenance/rail/rail_planner.php | cut -d' ' -f1)"
          endpointsum="$(sha256sum maintenance/rail/rail_journeys.php | cut -d' ' -f1)"
          mmsum="$(sha256sum maintenance/rail/multimodal_planner.php | cut -d' ' -f1)"
          mmapi="$(sha256sum maintenance/rail/multimodal.php | cut -d' ' -f1)"
          tdetail="$(sha256sum maintenance/rail/rail_train_detail.php | cut -d' ' -f1)"
          tdetailapi="$(sha256sum maintenance/rail/train_detail.php | cut -d' ' -f1)"
          gatewayhash="$(sha256sum maintenance/rail/rail_gateway.php | cut -d' ' -f1)"
          livehash="$(sha256sum maintenance/rail/rail_train_live.php | cut -d' ' -f1)"
          liveapi="$(sha256sum maintenance/rail/train_live.php | cut -d' ' -f1)"
          ssh rail-production bash -s -- \
            "$PRIVATE_DIR" "$PUBLIC_DIR" "$GITHUB_RUN_ID" "$indexsum" "$plannersum" "$endpointsum" "$mmsum" "$mmapi" "$tdetail" "$tdetailapi" "$gatewayhash" "$livehash" "$liveapi" <<'REMOTE'
          set -Eeuo pipefail
          priv="$1"; pub="$2"; rid="$3"; idxhash="$4"; phash="$5"; ehash="$6"; mhash="$7"; mahash="$8"; tdhash="$9"; tdapihash="${10}"; ghash="${11}"; lhash="${12}"; lapi="${13}"
          [[ "$priv" == /* && "$pub" == /* && "$rid" =~ ^[0-9]+$ ]]
          stage="$HOME/openroad-rail-stage-$rid"
          echo RAIL_REMOTE_CHECK_BEGIN
          test -f "$priv/lib/auth.php" && test -f "$pub/api/v1/journeys.php"
          test -f "$stage/rail-index/manifest.json"
          test "$(cd "$stage/rail-index" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" = "$idxhash"
          test "$(sha256sum "$stage/rail_planner.php" | cut -d' ' -f1)" = "$phash"
          test "$(sha256sum "$stage/rail_journeys.php" | cut -d' ' -f1)" = "$ehash"
          test "$(sha256sum "$stage/multimodal_planner.php" | cut -d' ' -f1)" = "$mhash"
          test "$(sha256sum "$stage/multimodal.php" | cut -d' ' -f1)" = "$mahash"
          test "$(sha256sum "$stage/rail_train_detail.php" | cut -d' ' -f1)" = "$tdhash"
          test "$(sha256sum "$stage/train_detail.php" | cut -d' ' -f1)" = "$tdapihash"
          test "$(sha256sum "$stage/rail_gateway.php" | cut -d' ' -f1)" = "$ghash"
          test "$(sha256sum "$stage/rail_train_live.php" | cut -d' ' -f1)" = "$lhash"
          test "$(sha256sum "$stage/train_live.php" | cut -d' ' -f1)" = "$lapi"
          php -l "$stage/rail_planner.php" >/dev/null
          php -l "$stage/rail_journeys.php" >/dev/null
          php -l "$stage/multimodal_planner.php" >/dev/null
          php -l "$stage/multimodal.php" >/dev/null
          php -l "$stage/rail_train_detail.php" >/dev/null
          php -l "$stage/train_detail.php" >/dev/null
          php -l "$stage/rail_gateway.php" >/dev/null
          php -l "$stage/rail_train_live.php" >/dev/null
          php -l "$stage/train_live.php" >/dev/null
          php "$stage/test_train_live.php"
          test -f "$stage/rail-index/events.sqlite"
          base="$priv/cache/rail-routing"
          dest="$base/versions/$rid"
          test ! -e "$dest"
          mkdir -p "$dest"
          echo RAIL_INDEX_EXTRACT_BEGIN
          # Directory rename on the same filesystem is atomic and negligible.
          mv "$stage/rail-index" "$dest/rail-index"
          test -f "$dest/rail-index/manifest.json"
          size="$(du -sk "$dest" | cut -f1)"
          test "$size" -gt 0 && test "$size" -le 96000
          timeout 8 php -d memory_limit=96M "$stage/test_real_smoke.php" "$dest/rail-index"
          timeout 8 php -d memory_limit=96M "$stage/test_multimodal.php" "$dest/rail-index"
          timeout 8 php -d memory_limit=96M "$stage/test_train_detail.php" "$dest/rail-index"
          echo RAIL_INDEX_VERIFIED
          if test -e "$base/current" && test ! -L "$base/current"; then
            echo 'Unmanaged rail index; refusing activation' >&2
            exit 1
          fi
          backup="$HOME/openroad-rail-backups/$rid"
          mkdir -p "$backup"
          if test -f "$priv/lib/rail_planner.php"; then cp -p "$priv/lib/rail_planner.php" "$backup/rail_planner.php"; fi
          if test -f "$pub/api/v1/rail_journeys.php"; then cp -p "$pub/api/v1/rail_journeys.php" "$backup/rail_journeys.php"; fi
          if test -f "$priv/lib/multimodal_planner.php"; then cp -p "$priv/lib/multimodal_planner.php" "$backup/multimodal_planner.php"; fi
          if test -f "$pub/api/v1/multimodal.php"; then cp -p "$pub/api/v1/multimodal.php" "$backup/multimodal.php"; fi
          if test -f "$priv/lib/rail_train_detail.php"; then cp -p "$priv/lib/rail_train_detail.php" "$backup/rail_train_detail.php"; fi
          if test -f "$pub/api/v1/train_detail.php"; then cp -p "$pub/api/v1/train_detail.php" "$backup/train_detail.php"; fi
          if test -f "$priv/lib/rail_gateway.php"; then cp -p "$priv/lib/rail_gateway.php" "$backup/rail_gateway.php"; fi
          if test -f "$priv/lib/rail_train_live.php"; then cp -p "$priv/lib/rail_train_live.php" "$backup/rail_train_live.php"; fi
          if test -f "$pub/api/v1/train_live.php"; then cp -p "$pub/api/v1/train_live.php" "$backup/train_live.php"; fi
          rollback(){
            trap - ERR
            if test -f "$backup/rail_planner.php"; then cp -p "$backup/rail_planner.php" "$priv/lib/rail_planner.php"; else rm -f "$priv/lib/rail_planner.php"; fi
            if test -f "$backup/rail_journeys.php"; then cp -p "$backup/rail_journeys.php" "$pub/api/v1/rail_journeys.php"; else rm -f "$pub/api/v1/rail_journeys.php"; fi
            if test -f "$backup/multimodal_planner.php"; then cp -p "$backup/multimodal_planner.php" "$priv/lib/multimodal_planner.php"; else rm -f "$priv/lib/multimodal_planner.php"; fi
            if test -f "$backup/multimodal.php"; then cp -p "$backup/multimodal.php" "$pub/api/v1/multimodal.php"; else rm -f "$pub/api/v1/multimodal.php"; fi
            if test -f "$backup/rail_train_detail.php"; then cp -p "$backup/rail_train_detail.php" "$priv/lib/rail_train_detail.php"; else rm -f "$priv/lib/rail_train_detail.php"; fi
            if test -f "$backup/train_detail.php"; then cp -p "$backup/train_detail.php" "$pub/api/v1/train_detail.php"; else rm -f "$pub/api/v1/train_detail.php"; fi
            if test -f "$backup/rail_gateway.php"; then cp -p "$backup/rail_gateway.php" "$priv/lib/rail_gateway.php"; fi
            if test -f "$backup/rail_train_live.php"; then cp -p "$backup/rail_train_live.php" "$priv/lib/rail_train_live.php"; else rm -f "$priv/lib/rail_train_live.php"; fi
            if test -f "$backup/train_live.php"; then cp -p "$backup/train_live.php" "$pub/api/v1/train_live.php"; else rm -f "$pub/api/v1/train_live.php"; fi
            echo 'Rail endpoint rollback attempted' >&2
          }
          trap rollback ERR
          cp "$stage/rail_planner.php" "$priv/lib/rail_planner.php.new"
          chmod 0640 "$priv/lib/rail_planner.php.new"
          cp "$stage/rail_journeys.php" "$pub/api/v1/rail_journeys.php.new"
          chmod 0644 "$pub/api/v1/rail_journeys.php.new"
          cp "$stage/multimodal_planner.php" "$priv/lib/multimodal_planner.php.new"
          chmod 0640 "$priv/lib/multimodal_planner.php.new"
          cp "$stage/multimodal.php" "$pub/api/v1/multimodal.php.new"
          chmod 0644 "$pub/api/v1/multimodal.php.new"
          cp "$stage/rail_train_detail.php" "$priv/lib/rail_train_detail.php.new"
          chmod 0640 "$priv/lib/rail_train_detail.php.new"
          cp "$stage/train_detail.php" "$pub/api/v1/train_detail.php.new"
          chmod 0644 "$pub/api/v1/train_detail.php.new"
          cp "$stage/rail_gateway.php" "$priv/lib/rail_gateway.php.new"
          chmod 0640 "$priv/lib/rail_gateway.php.new"
          cp "$stage/rail_train_live.php" "$priv/lib/rail_train_live.php.new"
          chmod 0640 "$priv/lib/rail_train_live.php.new"
          cp "$stage/train_live.php" "$pub/api/v1/train_live.php.new"
          chmod 0644 "$pub/api/v1/train_live.php.new"
          mv -f "$priv/lib/rail_planner.php.new" "$priv/lib/rail_planner.php"
          mv -f "$pub/api/v1/rail_journeys.php.new" "$pub/api/v1/rail_journeys.php"
          mv -f "$priv/lib/multimodal_planner.php.new" "$priv/lib/multimodal_planner.php"
          mv -f "$pub/api/v1/multimodal.php.new" "$pub/api/v1/multimodal.php"
          mv -f "$priv/lib/rail_train_detail.php.new" "$priv/lib/rail_train_detail.php"
          mv -f "$pub/api/v1/train_detail.php.new" "$pub/api/v1/train_detail.php"
          mv -f "$priv/lib/rail_gateway.php.new" "$priv/lib/rail_gateway.php"
          mv -f "$priv/lib/rail_train_live.php.new" "$priv/lib/rail_train_live.php"
          mv -f "$pub/api/v1/train_live.php.new" "$pub/api/v1/train_live.php"
          php -l "$priv/lib/rail_planner.php" >/dev/null
          php -l "$pub/api/v1/rail_journeys.php" >/dev/null
          php -l "$priv/lib/multimodal_planner.php" >/dev/null
          php -l "$pub/api/v1/multimodal.php" >/dev/null
          php -l "$priv/lib/rail_train_detail.php" >/dev/null
          php -l "$pub/api/v1/train_detail.php" >/dev/null
          php -l "$priv/lib/rail_gateway.php" >/dev/null
          php -l "$priv/lib/rail_train_live.php" >/dev/null
          php -l "$pub/api/v1/train_live.php" >/dev/null
          ln -s "versions/$rid/rail-index" "$base/current.new"
          mv -Tf "$base/current.new" "$base/current"
          trap - ERR
          echo "RAIL_PRODUCTION_ACTIVATED index_kib=$size"
          # Keep only the current and two most recent OpenRoad-owned rail
          # indices. Never touch anything outside the dedicated versions dir.
          # CageFS may not expose /dev/fd for Bash process substitution.
          # Version names are strictly numeric, so safe word splitting is used.
          indices=($(find "$base/versions" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
              grep -E '^[0-9]{8,}$' | sort -n || true))
          if test "${#indices[@]}" -gt 3; then
            for ((i=0;i<${#indices[@]}-3;i++)); do
              old="$base/versions/${indices[i]}"
              if test ! -L "$old" && test -d "$old" && test "${indices[i]}" != "$rid"; then
                rm -rf -- "$old"
              fi
            done
          fi
          rm -rf -- "$stage"
          echo "RAIL_RETENTION_COMPLETE"
          REMOTE
