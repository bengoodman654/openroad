name: OpenRoad transport server — verify and deploy
on:
  push:
    branches: [main]
    paths:
      - 'OpenRoad-Transport-Server-v*-upgrade.zip'
      - '.github/workflows/cpanel.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Type DEPLOY to publish the latest checked upgrade to cPanel'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: openroad-production-server
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      archive: ${{ steps.select.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        name: Select upgrade package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -name 'OpenRoad-Transport-Server-v*-upgrade.zip' -printf '%f\n' | sort -V | tail -1)"
          test -n "$archive"
          [[ "$archive" =~ ^OpenRoad-Transport-Server-v[0-9]+\.[0-9]+\.[0-9]+-upgrade\.zip$ ]] || { echo 'No valid versioned server upgrade ZIP found' >&2; exit 1; }
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          mkdir -p staging
          unzip -q "$archive" -d staging
          find staging -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Upload verified server archive
        uses: actions/upload-artifact@v4
        with:
          name: verified-server-upgrade
          path: ${{ steps.select.outputs.archive }}
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'DEPLOY'
    runs-on: ubuntu-24.04
    environment: openroad-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-server-upgrade
      - name: Configure SSH with pinned host key
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_openroad_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy only four allowlisted PHP files
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
          PRIVATE_DIR: ${{ vars.CPANEL_OPENROAD_PRIVATE_DIR }}
          PUBLIC_DIR: ${{ vars.CPANEL_OPENROAD_PUBLIC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing CPANEL_SSH_HOST secret}"
          : "${SSH_USER:?Missing CPANEL_SSH_USER secret}"
          : "${PRIVATE_DIR:?Missing CPANEL_OPENROAD_PRIVATE_DIR variable}"
          : "${PUBLIC_DIR:?Missing CPANEL_OPENROAD_PUBLIC_DIR variable}"
          case "$PRIVATE_DIR $PUBLIC_DIR" in *[!a-zA-Z0-9_./\ \-]* ) echo 'Unexpected deploy directory character'; exit 1;; esac
          archive="${{ needs.verify.outputs.archive }}"
          ssh_opts=(-i ~/.ssh/id_openroad_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          scp -i ~/.ssh/id_openroad_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$archive" "$SSH_USER@$SSH_HOST:openroad-upgrade.zip"
          # Directories are passed as positional arguments, not interpolated in remote shell code.
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$PRIVATE_DIR" "$PUBLIC_DIR" <<'REMOTE'
          set -Eeuo pipefail
          priv="$1";pub="$2"
          [[ "$priv" == /* && "$pub" == /* ]] || exit 1
          tmp="$(mktemp -d "${HOME}/openroad-deploy.XXXXXX")"
          trap 'rm -rf "$tmp"; rm -f "${HOME}/openroad-upgrade.zip"' EXIT
          unzip -q "${HOME}/openroad-upgrade.zip" -d "$tmp"
          src="$(find "$tmp" -maxdepth 1 -mindepth 1 -type d | head -1)"
          test -n "$src"
          backup="$HOME/openroad-backups/$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup/private/lib" "$backup/public/api/v1"
          relative=(private/lib/bootstrap.php private/lib/router.php public/api/v1/journeys.php public/api/v1/status.php)
          target=("$priv/lib/bootstrap.php" "$priv/lib/router.php" "$pub/api/v1/journeys.php" "$pub/api/v1/status.php")
          test -f "$src/SHA256SUMS.txt"
          (cd "$src" && sha256sum -c SHA256SUMS.txt)
          [[ -d "$priv/lib" && -d "$pub/api/v1" ]] || { echo 'Target directory missing; refusing deploy' >&2; exit 1; }
          backup="$HOME/openroad-backups/$(date -u +%Y%m%dT%H%M%SZ)-$$"
          for i in "${!relative[@]}"; do
            test -f "$src/${relative[$i]}" && test -f "${target[$i]}"
            php -l "$src/${relative[$i]}" >/dev/null
            mkdir -p "$backup/$(dirname "${relative[$i]}")"
            cp -p "${target[$i]}" "$backup/${relative[$i]}"
          done
          rollback() {
            rc="$?"
            trap - ERR
            for i in "${!relative[@]}"; do
              if [ -f "$backup/${relative[$i]}" ]; then
                cp -p "$backup/${relative[$i]}" "${target[$i]}.rollback" &&
                  mv -f "${target[$i]}.rollback" "${target[$i]}" || true
              fi
            done
            echo 'Deployment failed; attempted restoration of backed-up PHP files.' >&2
            exit "$rc"
          }
          trap rollback ERR
          for i in "${!relative[@]}"; do
            cp "$src/${relative[$i]}" "${target[$i]}.new"
            chmod --reference="${target[$i]}" "${target[$i]}.new"
            mv -f "${target[$i]}.new" "${target[$i]}"
            php -l "${target[$i]}" >/dev/null
          done
          php -r 'require $argv[1]; $db=openroad_db(); if ($db->query("SELECT 1")->fetchColumn() != 1) exit(1);' "$priv/lib/bootstrap.php"
          trap - ERR
          printf 'Validated, deployed and backed up under %s\n' "$backup"
          REMOTE